configuration:
  mqtt_host:
    name: MQTT broker host
    description: >-
      Leave empty to connect to the Home Assistant Mosquitto add-on automatically.
      Set it to use a different broker (e.g. 192.168.1.10).
  mqtt_port:
    name: MQTT broker port
    description: Only used when MQTT broker host is set.
  mqtt_username:
    name: MQTT username
    description: Only used when MQTT broker host is set.
  mqtt_password:
    name: MQTT password
    description: Only used when MQTT broker host is set.
  timezone:
    name: Timezone
    description: >-
      Timezone for stored timestamps (e.g. Europe/Berlin). Leave empty to manage it
      from the SenseHive Settings page.
  admin_password:
    name: Admin password (direct access)
    description: >-
      First password of the SenseHive `admin` user, used only for direct access on a
      port (inside Home Assistant there is no SenseHive login). Applies to a new
      database; afterwards change it under Settings, Account.
  heartbeat_master_key:
    name: Heartbeat master key
    description: >-
      Turns on the heartbeat receiver for edge nodes running the MQTT heartbeat agent.
      "auto": a private fleet key made once and kept with the add-on's data (in
      backups); add nodes with Heartbeats, Add node. Or 64 hex characters, the fleet
      key the agents were set up with. Empty = off.
  heartbeat_api_token:
    name: Heartbeat API token
    description: >-
      Optional bearer token (32+ characters) for other tools to read heartbeat status
      through the read-only API. Empty = API closed.
  heartbeat_broker:
    name: Heartbeat broker
    description: Public MQTT broker the agents use. Empty = broker.hivemq.com.
  heartbeat_port:
    name: Heartbeat broker port
    description: TLS port of the heartbeat broker (default 8883).
  heartbeat_broker_username:
    name: Heartbeat broker username
    description: SenseHive's login on the heartbeat broker, when your broker needs one. Empty = no login.
  heartbeat_broker_password:
    name: Heartbeat broker password
    description: The password for that login.
network:
  5000/tcp: Direct web access (optional, requires SenseHive login)
