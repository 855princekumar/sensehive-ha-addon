name: SenseHive
version: "1.7.0"
slug: sensehive
description: Lightweight MQTT topic logger and dashboard with history, CSV export, LWT device status, encrypted self-discovering topics and edge node heartbeats
url: https://github.com/855princekumar/sensehive-ha-addon
arch:
  - amd64
  - aarch64
init: false
# Opens inside Home Assistant (sidebar); users are authenticated by Home Assistant
ingress: true
ingress_port: 5000
panel_icon: mdi:hexagon-multiple-outline
panel_title: SenseHive
# Optional direct access: disabled by default, enable under Network (SenseHive login applies)
ports:
  5000/tcp: null
ports_description:
  5000/tcp: Direct web access (optional, requires SenseHive login)
# Discovers the Mosquitto broker automatically when it is installed
services:
  - mqtt:want
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  timezone: ""
  admin_password: ""
  heartbeat_master_key: ""
  heartbeat_api_token: ""
  heartbeat_broker: ""
  heartbeat_port: 8883
schema:
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  timezone: str?
  admin_password: password?
  heartbeat_master_key: password?
  heartbeat_api_token: password?
  heartbeat_broker: str?
  heartbeat_port: port
