name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Add-on lint (Home Assistant app linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7  # v2.21.1
        with:
          path: ./sensehive

  apparmor:
    name: AppArmor profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: sudo apt-get update && sudo apt-get install -y apparmor
      - name: Parse profile
        run: |
          sudo apparmor_parser -Q -K sensehive/apparmor.txt
          test "$(sudo apparmor_parser -Q -K -N sensehive/apparmor.txt)" = "sensehive"

  unit:
    name: Entry point unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pip install pytest && python -m pytest -v tests/test_run.py

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - id: info
        run: |
          echo "base=$(yq -r '.build_from.${{ matrix.arch }}' sensehive/build.yaml)" >> "$GITHUB_OUTPUT"
          echo "version=$(yq -r '.version' sensehive/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: sensehive
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_FROM=${{ steps.info.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.info.outputs.version }}

  sandbox:
    name: Functional sandbox test (Supervisor, ingress, Mosquitto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python tests/sandbox_test.py
