name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Add-on lint (Home Assistant app linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7  # v2.21.1
        with:
          path: ./sensehive

  apparmor:
    name: AppArmor profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: sudo apt-get update && sudo apt-get install -y apparmor
      - name: Parse profile
        run: |
          sudo apparmor_parser -Q -K sensehive/apparmor.txt
          test "$(sudo apparmor_parser -Q -K -N sensehive/apparmor.txt)" = "sensehive"

  unit:
    name: Entry point unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pip install pytest && python -m pytest -v tests/test_run.py

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - id: info
        run: |
          echo "base=$(yq -r '.build_from.${{ matrix.arch }}' sensehive/build.yaml)" >> "$GITHUB_OUTPUT"
          echo "version=$(yq -r '.version' sensehive/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: sensehive
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_FROM=${{ steps.info.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.info.outputs.version }}

  sandbox:
    name: Functional sandbox test (Supervisor, ingress, Mosquitto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: python tests/sandbox_test.py

  real-ha:
    name: Real Home Assistant (Supervisor and Core), with a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: 855princekumar/sense-hive
          path: sense-hive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Home Assistant from the official apps devcontainer (this repository as a local app repository)
        run: |
          docker run -d --privileged --name ha-dev -p 7080:80 \
            -v ha-dev-docker:/var/lib/docker -v ha-dev-containerd:/var/lib/containerd -v ha-dev-supervisor:/mnt/supervisor \
            --tmpfs /tmp -v "$PWD:/mnt/supervisor/apps/local/sensehive-ha-addon" ghcr.io/home-assistant/devcontainer:6-apps
          for i in $(seq 1 60); do docker exec ha-dev docker info >/dev/null 2>&1 && break; sleep 3; done
          docker exec -d ha-dev bash -c 'supervisor_run > /tmp/supervisor.log 2>&1'
          for i in $(seq 1 150); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7080/api/onboarding)" = 200 ] && break; sleep 10
          done
          docker exec ha-dev bash -lc 'ha core info --raw-json' | python -c "import json,sys;d=json.load(sys.stdin)['data'];print('Home Assistant', d['version'])"
      - name: Set up as a person would (onboarding, Mosquitto, SenseHive in the sidebar)
        run: |
          pw="e2e-$(openssl rand -hex 12)"; echo "::add-mask::$pw"; echo "E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker cp tests/ha-devcontainer/. ha-dev:/root/
          docker exec -e E2E_USER=e2e -e E2E_PASSWORD="$pw" ha-dev bash /root/setup_ha.sh
      - name: Ingress, data through Mosquitto, restart, backup, security rating (21 checks)
        run: docker exec -e E2E_USER=e2e -e E2E_PASSWORD="$E2E_PASSWORD" ha-dev bash /root/e2e.sh
      - name: A browser in Home Assistant (sign-in, sidebar, panel, an emulated fleet; phone to desktop)
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python -W ignore tests/ha-devcontainer/ha_browser_e2e.py --ha http://127.0.0.1:7080 --user e2e \
            --password "$E2E_PASSWORD" --sensehive sense-hive --out ha-report --min-checks 30 --shots ha-screenshots
      - name: Screenshots for the docs (the panel in Home Assistant, the add-on pages)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ha-screenshots
          path: ha-screenshots/*.png
      - name: Logs and screenshots of failures
        if: failure()
        run: |
          docker exec ha-dev bash -lc 'tail -60 /tmp/supervisor.log; ha apps logs local_sensehive | tail -60' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: failure()
        with:
          name: ha-report
          path: ha-report/*.png
